spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:window_db}?useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  hikari:
    maximum-pool-size: 8
    minimum-idle: 3
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

app:
  encryption:
    secret: ${AES_KEY}

cors:
  allowed-origins: ${CORS_ORIGINS:}

server:
  compression:
    enabled: true
